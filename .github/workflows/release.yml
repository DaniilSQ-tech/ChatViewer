name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller ChatViewer.spec --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c 'from version import __version__; print(__version__)').Trim()
          $exeName = "ChatViewer-$version.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$version" "/DMyAppExeName=$exeName" "installer\ChatViewer.iss"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = (python -c 'from version import __version__; print(__version__)').Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate release notes
        shell: pwsh
        run: .\scripts\prepare-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ChatList ${{ steps.ver.outputs.version }}
          body_path: dist/RELEASE_NOTES-${{ steps.ver.outputs.version }}.md
          files: |
            dist/ChatViewer-Setup-*.exe
            dist/ChatViewer-[0-9]*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
